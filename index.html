        .author-badge {

            bottom: 30px;
            right: 24px;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);

            border-radius: 50px;

            align-items: center;
            gap: 12px;
            color: #f8fafc;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);

        .author-badge::after {
            content: '';
            position: absolute;
            top: 0; 
            left: -150%; 
            width: 50%; 
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }

        /* Hiệu ứng khi Hover */
        .author-badge:hover {
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 12px 32px rgba(2, 132, 199, 0.35);
            border-color: #38bdf8;
            transform: translateY(-4px);
            padding-right: 20px;
        }

        .author-badge:hover::after {
            left: 200%;
        }

            height: 34px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);

            align-items: center;
            justify-content: center;
            font-size: 0.9rem;

            flex-shrink: 0;

        .author-badge:hover .author-avatar {

            align-items: center;

            font-size: 0.75rem;
        }

        .author-badge:hover .author-extra {
            max-width: 200px;
            opacity: 1;
            margin-left: 8px;
        }

                    <button type="button" class="hotel-action-btn hotel-action-btn--street" data-tooltip="Street View" title="Street View" aria-label="Mở Street View của ${hotel.name}" onclick="event.stopPropagation(); openGoogleStreetView('${hotel.id}')">
                        <i class="fa-solid fa-street-view" aria-hidden="true"></i>
                    </button>
                    <a href="${hotel.mapUrl}" target="_blank" rel="noopener noreferrer" class="hotel-action-btn hotel-action-btn--map" data-tooltip="Google Maps" title="Google Maps" aria-label="Mở ${hotel.name} trên Google Maps" onclick="event.stopPropagation()">
                        <i class="fa-solid fa-map-location-dot" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
            ${cardHighlightHTML}
            <div class="badges">
                <span class="badge"><i class="fa-solid fa-star" style="color:#f59e0b"></i> ${hotel.rating}</span>
                <span class="badge"><i class="fa-solid fa-water"></i> ${hotel.beachDist}</span>
            </div>
        </div>`;
    hotelListContainer.appendChild(card);
        // Thai Phung
    const customIcon = L.divIcon({
        className: 'custom-pin-container',
        html: `<div class="custom-hotel-marker" style="background-image:url('${mainImg}');"><div class="marker-price-badge">${showPrice ? hotel.priceTag : hotel.shortName}</div></div>`,
        iconSize: [52, 52], iconAnchor: [26, 26]
    });
    const marker = L.marker([hotel.lat, hotel.lng], { icon: customIcon });
    marker.bindPopup(createPopupHTML(hotel), { offset: [0, -12] });
    marker.on('popupopen', () => { startCarousel(hotel.id, hotel.images.length); highlightSidebarCard(hotel.id); });
    marker.on('popupclose', () => { stopCarousel(hotel.id); unhighlightSidebarCard(hotel.id); });
    marker.on('mouseover', function() { this.openPopup(); });
    marker.on('click', function() { map.flyTo([hotel.lat, hotel.lng], 16, { duration: 1.0 }); });
    markersMap[hotel.id] = marker;
    markerGroup.addLayer(marker);
});
markerGroup.addTo(map);

function fitAllMarkers() { map.fitBounds(markerGroup.getBounds().pad(0.15)); }
fitAllMarkers();

//t-p
function highlightSidebarCard(id) {
    document.querySelectorAll('.hotel-card').forEach(c => c.classList.remove('selected'));
    const c = document.getElementById('card-' + id);
    if (c) { c.classList.add('selected'); c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}
function unhighlightSidebarCard(id) { const c = document.getElementById('card-' + id); if(c) c.classList.remove('selected'); }
function focusHotel(id) {
    const h = hotels.find(x => x.id === id);
    if (h) { map.flyTo([h.lat, h.lng], 16, { duration: 1.0 }); markersMap[id].openPopup(); highlightSidebarCard(id); }
}

// Phung Thai
function createPopupHTML(hotel) {
    const slidesHTML = hotel.images.map((img, i) => `<img src="${img}" class="carousel-slide ${i===0?'active':''}" id="slide-${hotel.id}-${i}" alt="${hotel.name}" loading="lazy">`).join('');
    const dotsHTML = hotel.images.map((_, i) => `<div class="dot ${i===0?'active':''}" id="dot-${hotel.id}-${i}" onclick="manualSelectSlide('${hotel.id}',${i})"></div>`).join('');
    const amenitiesHTML = hotel.amenities.map(a => `<div class="amenity-item"><i class="fa-solid ${a.icon}"></i><span>${a.text}</span></div>`).join('');
    return `<div>
        <div class="carousel-container">
            ${slidesHTML}
            <div class="photo-nav-bar">
                <span class="photo-counter" id="counter-${hotel.id}">1 / ${hotel.images.length}</span>
                <div class="photo-dots">${dotsHTML}</div>
            </div>
        </div>
        <div class="popup-body">
            <div class="popup-title-row">
                <h4>${hotel.name}</h4>
                <div class="rating-badge"><i class="fa-solid fa-star"></i> ${hotel.rating}★</div>
            </div>
            <div class="location-info"><i class="fa-solid fa-location-dot" style="color:#ef4444;flex-shrink:0;margin-top:2px;"></i><span>${hotel.address}</span></div>
            <div style="font-size:0.77rem;font-weight:700;color:#0284c7;margin-bottom:6px;"><i class="fa-solid fa-water"></i> Cách biển: ${hotel.beachDist}</div>
            <div class="amenities-section">
                <div class="amenities-title">Tiện ích nổi trội</div>
                <div class="amenities-grid">${amenitiesHTML}</div>
            </div>
            <div class="meta-info-grid">
                <div><i class="fa-solid fa-phone" style="color:#0284c7;"></i> ${hotel.phone}</div>
                <div><i class="fa-solid fa-clock" style="color:#0284c7;"></i> ${hotel.checkin}</div>
            </div>
            <div class="popup-action-buttons">
                <button class="streetview-btn" onclick="openGoogleStreetView('${hotel.id}')"><i class="fa-solid fa-street-view"></i> Xem Chế Độ Xem Phố (Street View)</button>
                <div class="secondary-links-row">
                    <a href="${hotel.agodaUrl}" target="_blank" class="sec-link-btn"><i class="fa-solid fa-hotel" style="color:#e11d48;"></i> Agoda</a>
                    <a href="${hotel.mapUrl}" target="_blank" class="sec-link-btn"><i class="fa-solid fa-map" style="color:#0284c7;"></i> Google Maps</a>
                </div>
            </div>
        </div>
    </div>`;
}

function startCarousel(hotelId, totalSlides) {
    stopCarousel(hotelId);
    let idx = 0;
    activeCarouselIntervals[hotelId] = setInterval(() => { idx = (idx + 1) % totalSlides; showSlide(hotelId, idx, totalSlides); }, 3000);
}
function stopCarousel(hotelId) { if(activeCarouselIntervals[hotelId]) { clearInterval(activeCarouselIntervals[hotelId]); delete activeCarouselIntervals[hotelId]; } }
function manualSelectSlide(hotelId, index) { const h = hotels.find(x => x.id===hotelId); if(!h) return; showSlide(hotelId,index,h.images.length); startCarousel(hotelId,h.images.length); }
function showSlide(hotelId, slideIndex, totalSlides) {
    for(let i=0;i<totalSlides;i++) {
        const s = document.getElementById(`slide-${hotelId}-${i}`);
        const d = document.getElementById(`dot-${hotelId}-${i}`);
        if(s) s.classList.remove('active');
        if(d) d.classList.remove('active');
    }
    const as = document.getElementById(`slide-${hotelId}-${slideIndex}`);
    const ad = document.getElementById(`dot-${hotelId}-${slideIndex}`);
    const ac = document.getElementById(`counter-${hotelId}`);
    if(as) as.classList.add('active');
    if(ad) ad.classList.add('active');
    if(ac) ac.innerText = `${slideIndex+1} / ${totalSlides}`;
}

function openGoogleStreetView(hotelId) {
    const h = hotels.find(x => x.id === hotelId);
    if (!h) return;

    // 1. Thêm tham số panoid cho Iframe Embed (nếu có panoId thì ưu tiên panoid thay vì cbll) - TP
    const embedLocation = h.panoId ? `panoid=${h.panoId}` : `cbll=${h.latStr},${h.lngStr}`;
    document.getElementById('sv-iframe').src = `https://maps.google.com/maps?layer=c&${embedLocation}&cbp=11,${h.svHeadingStr},0,0,0&output=svembed`;

    document.getElementById('sv-title').innerHTML = `<i class="fa-solid fa-street-view" style="color:#38bdf8;"></i> Xem Phố: <strong>${h.name}</strong>`;

    // 2. Thêm &panoid=${h.panoId} vào link mở Maps đầy đủ. [ t-p)
    const fullPanoParam = h.panoId ? `&panoid=${h.panoId}` : '';
    document.getElementById('sv-full-btn').href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${h.latStr},${h.lngStr}&heading=${h.svHeadingStr}${fullPanoParam}`;

    document.getElementById('sv-agoda-btn').href = h.agodaUrl;
    document.getElementById('sv-modal').classList.add('active');
}
function closeStreetViewModal() { document.getElementById('sv-iframe').src = ''; document.getElementById('sv-modal').classList.remove('active'); }

let routePolyline = null, isRouteActive = false, isRouteLoading = false;
async function toggleRoute() {
    const btn = document.getElementById('btn-route');
    if (isRouteLoading) return;
    if (isRouteActive) {
        if (routePolyline) {
            map.removeLayer(routePolyline);
            routePolyline = null;
        }
        btn.classList.remove('btn-active');
        btn.innerHTML = '<i class="fa-solid fa-route"></i> Tuyến Đường (7 KS)';
        isRouteActive = false;
        return;
    }
    const routeHotelIds = ['minhtoan', 'muongthanh', 'fivitel', 'nesta', 'paracel', 'nalod', 'sevensea'];
    const routeHotels = routeHotelIds.map(id => hotels.find(hotel => hotel.id === id)).filter(Boolean);
    const coordinates = routeHotels.map(hotel => `${hotel.lng},${hotel.lat}`).join(';');
    const routeUrl = `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson&steps=false`;
    try {
        isRouteLoading = true;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tìm đường...';
        const response = await fetch(routeUrl);
        if (!response.ok) throw new Error(`OSRM HTTP ${response.status}`);
        const data = await response.json();
        if (data.code !== 'Ok' || !data.routes?.length) throw new Error(data.message || 'Không tìm thấy tuyến đường');
        routePolyline = L.geoJSON(data.routes[0].geometry, { style: { color:'#ef4444', weight:6, opacity:0.9, lineCap:'round', lineJoin:'round' } }).addTo(map);
        map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });
        btn.classList.add('btn-active');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Đang Hiện Đường (7 KS)';
        isRouteActive = true;
    } catch (error) {
        console.error('Không thể tải tuyến đường:', error);
        btn.classList.remove('btn-active');
        btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Không Tìm Thấy Đường';
        setTimeout(() => {
            if (!isRouteActive) btn.innerHTML = '<i class="fa-solid fa-route"></i> Tuyến Đường (7 KS)';
        }, 2500);
    } finally {
        isRouteLoading = false;
        btn.disabled = false;
    }
}

<script src="https://counterapi.com/c.js?ns=nashers-dong-chill-v2.github.io" async></script>
<div class="counterapi" key="homepage" action="view" behavior="view" nocss="true" noicon="true" style="display:none;"></div>
<script>
// Mirror the value rendered by CounterAPI into the existing author badge.
(function syncPageViewCounter() {
    const source = document.querySelector('.counterapi');
    const target = document.getElementById('page-view-count');
    if (!source || !target) return;

    const sync = () => {
        const text = source.textContent.trim();
        const match = text.match(/[\d.,]+/);
        if (match) target.textContent = match[0];
    };

    new MutationObserver(sync).observe(source, { childList: true, subtree: true, characterData: true });
    sync();
    setTimeout(() => {
        if (target.textContent === '...') target.textContent = '—';
    }, 8000);
})();
</script>
